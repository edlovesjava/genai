[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genesis"
version = "0.1.0"
description = "Agentic kernel for SDLC-driven code generation"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "click>=8.0",
    "rich>=13.0",
    "quick-task",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
]

[project.scripts]
genesis = "genesis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/genesis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
