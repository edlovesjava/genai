[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genspec"
version = "0.1.0"
description = "Specifications as first-class, high-fidelity, validatable source of truth"
requires-python = ">=3.11"
# Intentionally zero runtime dependencies: the spec format must stay portable
# and the parser stays hand-written so specs remain inspectable.
dependencies = []

[project.optional-dependencies]
# The orchestration layer can run on real Genesis primitives (message bus,
# state machine). This extra is optional so genspec installs and tests on its
# own; orchestrate_genesis imports genesis lazily.
genesis = [
    "genesis",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
genspec = "genspec.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/genspec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
